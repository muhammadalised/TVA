# English ED WD character baseline: extracted files, all five folds.
# Run: python train_cv.py -c configs/thesis/ed/character_wd_extracted_cv.yaml
arch_de: bilstm_b
arch_en: blconv_b
aug: true
cache: true
checkpoint: null
dataset_format: json-directory
device: cuda
dir_dataset: data/tva/ed/gold_wd
dir_tokenizer: null
dir_work: results/thesis/ed/character_wd_extracted_cv
